<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NETTRADES Installer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>NETTRADES Installer</h1>
      <p class="subtitle">Sovereign AI for Autonomous Enterprises</p>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="welcome">Welcome</button>
      <button class="tab" data-tab="deployment">Deployment</button>
      <button class="tab" data-tab="progress">Installation</button>
    </div>

    <!-- Tab Content -->
    <div id="tab-welcome" class="tab-content active">
      <h2>Welcome</h2>
      <p>This installer will set up the NetTrades Sovereign AI platform.</p>
      <p>Click "Next" to continue.</p>
      <button id="btn-next" class="btn primary">Next</button>
    </div>

    <div id="tab-deployment" class="tab-content">
      <h2>Choose Your Deployment</h2>
      <div id="deployment-cards"></div>
      <div id="advanced-settings" style="display:none;">
        <!-- Advanced options -->
      </div>
      <button id="btn-install" class="btn success">Install</button>
    </div>

    <div id="tab-progress" class="tab-content">
      <h2>Installation Progress</h2>
      <div class="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
      <div id="progress-label">Initializing...</div>
      <div id="log-output" class="log-output"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
