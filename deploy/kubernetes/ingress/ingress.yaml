# =============================================================================
# Section: G – Traefik Ingress resources.
# TLS certificates are automatically provisioned by cert-manager via Let's Encrypt.
# Sticky sessions for Odoo ensure the same user reaches the same backend pod.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
  namespace: frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/affinity: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: nettrades.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069
  tls:
    - hosts:
        - nettrades.ai
      secretName: odoo-tls
