# =============================================================================
# NETTRADES.AI – Odoo Deployment (UPDATED)
# =============================================================================
# FILE: deploy/kubernetes/apps/frontend/odoo-deployment.yaml
#
# PURPOSE:
#   This file defines the Odoo 19 CE deployment on Kubernetes.
#   It includes all custom NETTRADES modules and the new bridge module.
#
# UPDATED:
#   - Added all new self-improving modules to the addons volume
#   - Added environment variables for the bridge
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: frontend
  labels:
    app: odoo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      containers:
        - name: odoo
          image: nettrades/odoo:19.0
          ports:
            - containerPort: 8069
          env:
            - name: HOST
              value: odoo-db-rw.backend.svc.cluster.local
            - name: PORT
              value: "5432"
            - name: USER
              value: odoo
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: NETTRADES_BRIDGE_URL
              value: http://bridge.ai.svc.cluster.local:8000
            - name: NETTRADES_REMOTE_BRAIN_URL
              value: https://api.nettrades.ai
            - name: NETTRADES_BRAIN_MODE
              value: hybrid
          volumeMounts:
            - name: odoo-addons
              mountPath: /mnt/extra-addons
            - name: odoo-filestore
              mountPath: /var/lib/odoo
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: odoo-addons
          persistentVolumeClaim:
            claimName: odoo-addons
        - name: odoo-filestore
          persistentVolumeClaim:
            claimName: odoo-filestore