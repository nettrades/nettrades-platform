# =============================================================================
# Section: H – Central GPUStack server – Kubernetes central deployment
# Orchestrates all inference workloads across the distributed GPU fleet.
# In the past JWT secret may have been required for signing worker registration tokens.
# =============================================================================
# GPUStack's built-in Prometheus and Grafana are disabled on the central
# server.  Metrics are scraped by the external Prometheus (port 10161) and
# visualised in the external Grafana.  The GPUSTACK_GRAFANA_URL environment
# variable tells GPUStack to point its UI links to the external Grafana
# instead of starting its own embedded stack.
#
# Client companies running their own GPUStack server (Trusted Mode) keep
# the built-in Grafana for anonymous Viewer access to GPU dashboards.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpustack
  namespace: gpustack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpustack
  template:
    metadata:
      labels:
        app: gpustack
    spec:
      containers:
        - name: gpustack
          image: gpustack/gpustack:v2.1.2
          ports:
            - containerPort: 80
          env:
            - name: GPUSTACK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gpustack-secret
                  key: jwt-secret
            # Disable built-in observability; use external Grafana
            - name: GPUSTACK_GRAFANA_URL
              value: "https://grafana.nettrades.ai"
          volumeMounts:
            - name: gpustack-data
              mountPath: /var/lib/gpustack
      volumes:
        - name: gpustack-data
          persistentVolumeClaim:
            claimName: gpustack-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpustack-pvc
  namespace: gpustack
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gpustack
  namespace: gpustack
spec:
  selector:
    app: gpustack
  ports:
    - port: 80
      targetPort: 80