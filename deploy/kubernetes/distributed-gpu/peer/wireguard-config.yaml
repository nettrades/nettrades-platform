# =============================================================================
# FILE: deploy/kubernetes/distributed-gpu/peers/wireguard-config.yaml
# =============================================================================
# PURPOSE:
#   WireGuard ConfigMap and Secret for distributed GPU worker nodes.
#   This ConfigMap provides the wg0.conf file that configures the WireGuard
#   VPN tunnel on each Kubernetes node in the GPU cluster.
#
# USAGE:
#   1. Generate WireGuard keys (see notes below).
#   2. Replace the placeholders (${...}) with your actual values.
#      You can use envsubst, Helm, or Kustomize to inject them.
#   3. Apply with: kubectl apply -f wireguard-config.yaml
#
# How to Use It:
# Generate the required keys (server private, peer public, peer PSK) – the comments show how.
# Replace the placeholders (${WG_PRIVATE_KEY}, ${PEER1_PUBLIC_KEY}, etc.) with your actual values.
#        You can use envsubst, a Helm chart, or Kustomize to inject them automatically.
#    Apply the YAML:
#    bash
#    kubectl apply -f deploy/kubernetes/distributed-gpu/peers/wireguard-config.yaml
#
#    Verification:
#      The ConfigMap will contain the wg0.conf with the resolved keys.
#      The Secret will store the keys securely.
# This is the recommended approach for production GPU marketplace deployments – it’s secure, scalable, and well-commented.
# NOTES:
#   - The subnet 10.100.0.0/24 is used for the GPU marketplace VPN.
#     This is outside the admin VPN isolation range (10.0.0.0/16).
#   - PresharedKeys (PSK) are optional but recommended for extra security.
#     Generate a PSK with: wg genpsk
#   - The private keys are stored in a Kubernetes Secret, not in the ConfigMap.
# =============================================================================


# =============================================================================
# ConfigMap – Contains the WireGuard configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-peers
  namespace: gpustack
  labels:
    app: wireguard
    component: vpn
data:
  wg0.conf: |
    # =========================================================================
    # WireGuard Server Configuration (Hub node)
    # =========================================================================
    [Interface]
    # The private key of the WireGuard server (hub node).
    # This will be injected from a Kubernetes Secret.
    PrivateKey = ${WG_PRIVATE_KEY}
    
    # The IP address of the server within the VPN.
    Address = 10.100.0.1/24
    
    # The port on which the server listens for incoming connections.
    ListenPort = 51820
    
    # =========================================================================
    # Peer Definitions (GPU Worker Nodes)
    # =========================================================================
    
    # --- Peer 1: GPU Worker Node 1 ---
    [Peer]
    # The public key of this peer (GPU worker node).
    # Generated from the peer's private key.
    PublicKey = ${PEER1_PUBLIC_KEY}
    
    # Pre-shared key for this peer (optional but recommended for added security).
    # Generate with: wg genpsk
    PresharedKey = ${PEER1_PSK}
    
    # The IP address assigned to this peer within the VPN.
    AllowedIPs = 10.100.0.2/32
    
    # If this peer is behind NAT, specify its endpoint (optional).
    # Endpoint = <PEER1_PUBLIC_IP>:51820
    
    # Persistent keepalive to maintain the connection through NAT.
    PersistentKeepalive = 25
    
    # --- Peer 2: GPU Worker Node 2 ---
    [Peer]
    PublicKey = ${PEER2_PUBLIC_KEY}
    PresharedKey = ${PEER2_PSK}
    AllowedIPs = 10.100.0.3/32
    # Endpoint = <PEER2_PUBLIC_IP>:51820
    PersistentKeepalive = 25
    
    # --- Peer 3: GPU Worker Node 3 ---
    [Peer]
    PublicKey = ${PEER3_PUBLIC_KEY}
    PresharedKey = ${PEER3_PSK}
    AllowedIPs = 10.100.0.4/32
    # Endpoint = <PEER3_PUBLIC_IP>:51820
    PersistentKeepalive = 25
    
    # --- Add more peers as needed ---
    # [Peer]
    # PublicKey = ${PEERn_PUBLIC_KEY}
    # PresharedKey = ${PEERn_PSK}
    # AllowedIPs = 10.100.0.<n+1>/32
    # PersistentKeepalive = 25


# =============================================================================
# Secret – Stores all sensitive keys (private keys, public keys, PSKs)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-keys
  namespace: gpustack
  labels:
    app: wireguard
    component: vpn
type: Opaque
stringData:
  # Server private key (hub)
  privatekey: "${WG_PRIVATE_KEY}"
  
  # Peer 1 (GPU worker node 1)
  peer1-publickey: "${PEER1_PUBLIC_KEY}"
  peer1-psk: "${PEER1_PSK}"
  
  # Peer 2 (GPU worker node 2)
  peer2-publickey: "${PEER2_PUBLIC_KEY}"
  peer2-psk: "${PEER2_PSK}"
  
  # Peer 3 (GPU worker node 3)
  peer3-publickey: "${PEER3_PUBLIC_KEY}"
  peer3-psk: "${PEER3_PSK}"
  
  # Add more peers as needed
  # peern-publickey: "${PEERn_PUBLIC_KEY}"
  # peern-psk: "${PEERn_PSK}"