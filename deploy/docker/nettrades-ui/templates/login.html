<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETTRADES AI – Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #161b22;
            padding: 48px 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #30363d;
        }
        .login-container .logo {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .login-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-container p {
            color: #8b949e;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .btn-login {
            display: inline-block;
            padding: 14px 48px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #58a6ff;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #484f58;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover {
            color: #8b949e;
        }
        .features {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.75rem;
            color: #484f58;
        }
        .features span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🧠</div>
        <h1>NETTRADES AI</h1>
        <p>Sign in with your Odoo account to continue</p>
        <a href="/api/auth/login" class="btn-login">🔑 Sign in with Odoo</a>
        <a href="/" class="back-link">← Back to chat</a>
        <div class="features">
            <span>🔒 Sovereign</span>
            <span>⚡ Real-time</span>
            <span>🖥️ GPU-ready</span>
        </div>
    </div>
</body>
</html>
