<!DOCTYPE html>
<!--  FILE: deploy/docker/nettrades-ui/templates/login.html  -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETTRADES AI – Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #161b22;
            padding: 48px 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #30363d;
        }
        .login-container .logo {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .login-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-container > p {
            color: #8b949e;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .btn-login {
            display: inline-block;
            padding: 14px 48px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #58a6ff;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #484f58;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover {
            color: #8b949e;
        }
        .features {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.75rem;
            color: #484f58;
        }
        .features span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ---------------------------------------------------------------------
           NEW (2026-11): username/password form + OAuth divider
           These rules are additive. No existing rule above has been modified.
           --------------------------------------------------------------------- */

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #f0f6fc;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #58a6ff;
        }
        .form-group input::placeholder {
            color: #484f58;
        }

        /* Form submit button must inherit the .btn-login styling */
        button.btn-login {
            width: 100%;
            padding: 14px;
            font-family: inherit;
        }

        .error-message {
            background: rgba(255, 95, 87, 0.1);
            border: 1px solid rgba(255, 95, 87, 0.3);
            color: #ff8f8a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: left;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #484f58;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #30363d;
        }
        .divider span {
            padding: 0 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🧠</div>
        <h1>NETTRADES AI</h1>
        <p>Sign in with your Odoo account to continue</p>

        {% if error %}
        <div class="error-message">⚠️ {{ error }}</div>
        {% endif %}

        <!-- Primary path: username/password form. Works against Odoo's
             /web/session/authenticate endpoint. No OAuth configuration
             required. -->
        <form method="post" action="/admin/login" autocomplete="on">
            <input type="hidden" name="next" value="{{ next or '/admin' }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="admin" autocomplete="username"
                       autofocus required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="••••••••" autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn-login">🔓 Log in</button>
        </form>

        {% if oauth_enabled %}
        <!-- Alternative path: OAuth. Only rendered when ODOO_OAUTH_CLIENT_ID
             is a real value. Requires an OAuth 2.0 client registered in Odoo. -->
        <div class="divider"><span>Or</span></div>
        <a href="/api/auth/login" class="btn-login">🔑 Sign in with Odoo</a>
        {% endif %}

        <a href="/" class="back-link">← Back to chat</a>

        <div class="features">
            <span>🔒 Sovereign</span>
            <span>⚡ Real-time</span>
            <span>🖥️ GPU-ready</span>
        </div>
    </div>
</body>
</html>
