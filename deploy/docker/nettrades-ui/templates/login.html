<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETTRADES AI – Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #16213e;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-container h1 {
            color: #4fc3f7;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .login-container p {
            color: #aaa;
            margin-bottom: 24px;
        }
        .btn-login {
            display: inline-block;
            padding: 12px 40px;
            background: #0d47a1;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #1565c0;
        }
        .back-link {
            display: block;
            margin-top: 16px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>NETTRADES AI</h1>
        <p>Sign in with your Odoo account to continue</p>
        <a href="/api/auth/login" class="btn-login">Sign in with Odoo</a>
        <a href="/" class="back-link">← Back to chat</a>
    </div>
</body>
</html>
