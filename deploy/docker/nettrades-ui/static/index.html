<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NETTRADES AI Router</title>

    <!-- ======================================================================
    External Libraries
    ====================================================================== -->
    <!-- Markdown & Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js">
    </script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <!-- ======================================================================
    APP CONTAINER
    ====================================================================== -->
    <div id="app">

        <!-- ─── SIDEBAR ─── -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🧠</span>
                    <span class="logo-text">NETTRADES</span>
                </div>
                <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
            </div>

            <button id="new-chat-btn" class="new-chat-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                New Chat
            </button>

            <div class="sidebar-conversations" id="conversation-list">
                <!-- Conversations will be rendered here -->
                <div class="conversation-item active">
                    <span class="conversation-title">New Chat</span>
                    <span class="conversation-date">Today</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator" id="status-indicator">
                    <span class="status-dot" id="status-dot"></span>
                    <span class="status-text" id="status-text">Connecting...</span>
                </div>
                <button id="settings-btn" class="settings-btn" aria-label="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
                    </svg>
                </button>
            </div>
        </aside>

        <!-- ─── MAIN CHAT ─── -->
        <main id="main" class="main">
            <!-- Header -->
            <header class="chat-header">
                <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div class="chat-header-info">
                    <h2 id="chat-title">New Chat</h2>
                    <span class="chat-model" id="chat-model">DeepSeek-R1-Distill-Qwen-1.5B</span>
                </div>
                <div class="chat-header-actions">
                    <button id="auth-btn" class="auth-btn">Login</button>
                </div>
            </header>

            <!-- Messages -->
            <div id="chat-container" class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <!-- Welcome message rendered by JavaScript -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <textarea id="user-input" rows="1" placeholder="Ask something..." disabled></textarea>
                    <button id="send-btn" class="send-btn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                        </svg>
                    </button>
                </div>
                <div id="status-bar" class="status-bar">
                    <span id="status-text-bottom">Ready</span>
                </div>
            </div>
        </main>
    </div>

    <!-- ======================================================================
    JAVASCRIPT
    ====================================================================== -->
    <script>
        // API_BASE_URL is injected by FastAPI
        const API_BASE_URL = "{{API_BASE_URL}}";
    </script>
    <script src="/js/chat.js"></script>
</body>
</html>
