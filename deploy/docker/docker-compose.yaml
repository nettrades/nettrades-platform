# =============================================================================
# FILE: deploy/docker/docker-compose.yaml
# =============================================================================
# PURPOSE:
#   Defines all services for a single-VM deployment of the NETTRADES platform.
#
# INFERENCE ARCHITECTURE:
#   - Primary: NVIDIA Dynamo (frontend + backend) – GPU-accelerated distributed inference
#   - Fallback: llama.cpp – CPU inference, zero-dependency, works immediately
#   - Odoo provides the governance layer (users, models, GPU resources)
#   - LangGraph (custom app.py + uvicorn) orchestrates agents with state persistence
#
#
# SERVICES:
#   - Traefik: Reverse proxy with automatic Let's Encrypt SSL
#   - PostgreSQL 17 with pgvector: RAG embeddings & main database
#   - Postgres Exporter: Prometheus metrics for PostgreSQL
#   - Valkey 8: BSD-licensed in-memory store (sessions, ORM cache, bus)
#   - Odoo 19 CE: ERP, Marketplace, and AI Hub
#   - Odoo Proxy: HTTP JSON-RPC shim
#   - Prometheus: Metrics collection
#   - Grafana: Visualisation
#   - Node Exporter: System metrics for Prometheus
#   - NVIDIA Dynamo: Primary GPU inference engine (vLLM + distributed serving)
#   - llama.cpp: CPU fallback inference engine
#   - Self-Improving Service: Continuous learning and fine-tuning
#   - WireGuard: Admin VPN server
#   - Redirector: Landing page redirector
#   - gVisor: Container isolation runtime (security hardening)#
# =============================================================================
# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  web:
    external: true
  internal:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes – all persistent data uses named volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  dynamo_data:
    driver: local
  valkey_data:
  forgejo_data:
  odoo_data:
  prometheus_data:
  grafana_data:
  langgraph_data:
  llama_cpp_data:

# --------------------------------------------------------------------------
# Services
# --------------------------------------------------------------------------
services:

  # =========================================================================
  # 1. TRAEFIK - Reverse Proxy with Automatic Let's Encrypt SSL
  # =========================================================================
  traefik:
    image: traefik:v3.6.13
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ADMIN_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.websecure.http.tls=true
      - --accesslog
   #   - --api.insecure=true        #   REMOVE IN PRODUCTION
   #   - --log.level=DEBUG          #   REMOVE IN PRODUCTION
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/letsencrypt
    networks:
      - web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 2. POSTGRESQL with pgvector - RAG Embeddings & Main Database
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 3. POSTGRES EXPORTER - Prometheus Metrics for PostgreSQL
  # =========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo?sslmode=disable"
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 4. VALKEY - BSD-licensed in-memory store (sessions, ORM cache, bus)
  # =========================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --save 900 1 --save 300 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 5. ODOO 19 CE - ERP, Marketplace, and AI Hub (Governance Layer)
  # =========================================================================
  odoo:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.odoo
    # network_mode: host
    container_name: odoo
    # gVisor runtime for container isolation (security hardening)
    runtime: ${RUNTIME:-}
    ports:
      - "8069:8069"
    volumes:
      - ./odoo-modules:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      - ./odoo-logs:/var/log/odoo
    environment:
      - HOST=postgres
      - PORT=5432
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    labels:
      - traefik.enable=true
      # Route to /odoo path on the main domain
      - traefik.http.routers.odoo.rule=Host(`${DOMAIN}`) && PathPrefix(`/odoo`)
      - traefik.http.services.odoo.loadbalancer.server.port=8069
      # Strip the /odoo prefix before forwarding to Odoo
      - traefik.http.middlewares.odoo-strip.stripprefix.prefixes=/odoo
      - traefik.http.routers.odoo.middlewares=odoo-strip
      - traefik.http.middlewares.odoo-ratelimit.ratelimit.average=100
      - traefik.http.routers.odoo.middlewares=odoo-ratelimit
    networks:
      - web
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3



  # =========================================================================
  # 7. LANGGRAPH SERVER - Custom app.py + uvicorn (Full Control)
  # =========================================================================
  # This is the Autonomous Enterprise Platform layer – LangGraph agents with
  # state persistence, checkpointing, and multi-agent orchestration.
  # It uses the Dynamo API for inference, but remains separate from the core
  # inference routing so that customer agents don't break the distributed system.
  #
  # =========================================================================
  langgraph-server:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.langgraph
    container_name: langgraph-server
    # gVisor runtime for container isolation (security hardening)
    runtime: ${RUNTIME:-}
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - DATABASE_URL=postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Inference backend URLs – dynamically set by deployment script
      - LLM_BASE_URL=${LLM_BASE_URL:-http://dynamo:8000/v1}
      - DYNAMO_API_KEY=${DYNAMO_API_KEY:-dummy}
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-1}
      - ODOO_PASSWORD=${ADMIN_PASSWORD}
      - ODOO_PROXY_URL=${ODOO_PROXY_URL:-http://odoo-proxy:8080}
      - ODOO_API_KEY=${PROXY_API_KEY:-${ODOO_API_KEY}}
      - USE_ODOO_PROXY=${USE_ODOO_PROXY:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # LANGGRAPH_API_URL is used for URL generation (workaround for #7390)
      # This tells LangGraph its external URL so generated links include /api
      - LANGGRAPH_API_URL=https://${DOMAIN}/api
      # MOUNT_PREFIX is REMOVED – it has no effect on custom FastAPI app
      # - MOUNT_PREFIX=/api   # DELETED – not used
      - LANGGRAPH_TRUST_X_FORWARDED_HEADERS=true
    ports:
      - "8000:8000"
    volumes:
      - langgraph_data:/app/.langgraph
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Router rule for /api – strip prefix because FastAPI serves at root
      - traefik.http.routers.langgraph-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.langgraph-api.priority=100
      - traefik.http.routers.langgraph-api.service=langgraph-api@docker
      - traefik.http.routers.langgraph-api.entrypoints=web,websecure
      - traefik.http.routers.langgraph-api.tls=true
      - traefik.http.services.langgraph-api.loadbalancer.server.port=8000
      # stripPrefix is REQUIRED – FastAPI app expects /health, not /api/health
      - traefik.http.middlewares.langgraph-strip.stripprefix.prefixes=/api
      # Headers help LangGraph detect the proxy correctly
      - traefik.http.middlewares.langgraph-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.langgraph-headers.headers.customrequestheaders.X-Forwarded-Host=${DOMAIN}
      # Apply both middlewares: strip first, then headers
      - traefik.http.routers.langgraph-api.middlewares=langgraph-strip,langgraph-headers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
      - valkey
      - odoo-proxy
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 8. NETTRADES-UI - FastAPI (Served on Dedicated Port 3002)
  # =========================================================================
  nettrades-ui:
    build:
      context: ../../
      dockerfile: deploy/docker/nettrades-ui/Dockerfile
    container_name: nettrades-ui
    restart: unless-stopped
    ports:
      - "3002:8000"
    environment:
      - DOMAIN=${DOMAIN}
      - ODOO_URL=${ODOO_URL}
      - ODOO_PROXY_URL=${ODOO_PROXY_URL}
      - LANGGRAPH_URL=${LANGGRAPH_URL}
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY}
      - ODOO_API_KEY=${ODOO_API_KEY}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - SESSION_SECRET=${SESSION_SECRET}
      - UI_API_KEY=${UI_API_KEY}
      - ODOO_OAUTH_CLIENT_ID=${ODOO_OAUTH_CLIENT_ID}
      - ODOO_OAUTH_CLIENT_SECRET=${ODOO_OAUTH_CLIENT_SECRET}
      - ODOO_OAUTH_AUTHORIZE_URL=${ODOO_OAUTH_AUTHORIZE_URL}
      - ODOO_OAUTH_TOKEN_URL=${ODOO_OAUTH_TOKEN_URL}
      - ODOO_OAUTH_USERINFO_URL=${ODOO_OAUTH_USERINFO_URL}
      - ODOO_OAUTH_REDIRECT_URI=${ODOO_OAUTH_REDIRECT_URI}
      - API_BASE_URL=https://${DOMAIN}
    networks:
      - internal
    depends_on:
      - odoo-proxy
      - langgraph-server
    # No Traefik labels - served directly on port 3002
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 8. REDIRECTOR
  # =========================================================================
  redirector:
    image: nginx:alpine
    container_name: redirector
    restart: unless-stopped
    volumes:
      - ./redirector/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./redirector/landing-page:/usr/share/nginx/html:ro
    environment:
      - DOMAIN=${DOMAIN}
      - DEFAULT_LANDING_PAGE=${DEFAULT_LANDING_PAGE:-odoo}
    command: >
      sh -c "
        if [ ! -f /usr/share/nginx/html/index.html ]; then
          echo '<html><body><h1>NETTRADES Platform</h1><p>Landing page not configured.</p></body></html>' > /usr/share/nginx/html/index.html
        fi
        envsubst '\$DOMAIN \$DEFAULT_LANDING_PAGE' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        nginx -g 'daemon off;'
      "
    networks:
      - web
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redirector.rule=PathPrefix(`/`)"
      - "traefik.http.routers.redirector.priority=10"
      - "traefik.http.routers.redirector.entrypoints=web,websecure"
      - "traefik.http.routers.redirector.tls=true"
      - "traefik.http.services.redirector.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 9. ODOO PROXY - HTTP JSON-RPC Shim
  # =========================================================================
  odoo-proxy:
    build: ../../src/core/odoo_proxy
    container_name: odoo-proxy
    restart: unless-stopped
    networks:
      - internal
    environment:
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-1}
      - ODOO_PASSWORD=${ADMIN_PASSWORD}
      - PROXY_API_KEY=${PROXY_API_KEY:-${ODOO_API_KEY}}
      - ODOO_API_KEY=${PROXY_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8090:8080"
    depends_on:
      - odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 10. NVIDIA DYNAMO – Primary GPU Inference Engine (replaces GPUStack)
  # =========================================================================
  # Dynamo is a production-grade distributed inference runtime that includes
  # vLLM. It provides:
  #   - Disaggregated serving (prefill/decode separation)
  #   - KV cache-aware routing
  #   - Built-in fault tolerance and health checking
  #   - OpenAI-compatible API
  # This is the Sovereign AI layer – it handles all GPU routing and inference.
  #
  # For CPU-ONLY testing, we use the dynamo-frontend
  # container which is lightweight and requires no GPU. It provides the same
  # OpenAI-compatible API with mock workers, allowing full orchestration testing.
  # When a GPU becomes available, switch to the GPU runtime images:
  #   - nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.1
  #   - nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.3.1
  # =========================================================================
  dynamo:
    # CPU-compatible frontend for testing (no GPU required)
    image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.3.1
    container_name: dynamo
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "8001:8000"  # Expose to host for debugging
    volumes:
      - ./dynamo-data/models:/models
      - dynamo_data:/var/lib/dynamo
    environment:
      - OPENAI_API_KEY=${DYNAMO_API_KEY}
    # - MODEL_PATH=/models/${MODEL_NAME:-Qwen2.5-1.5B-Instruct}
      - DYNAMO_LOG_LEVEL=info
    # Frontend command with file-based discovery (no etcd needed)
    # For GPU-enabled Dynamo, use the default runtime (not gVisor)
    # gVisor does not support GPU passthrough yet
    entrypoint: ["python3", "-m", "dynamo.frontend"]
    command:
      - "--http-port"
      - "8000"
      - "--discovery-backend"
      - "file"
    labels:
      - traefik.enable=true
      - traefik.http.routers.dynamo.rule=Host(`dynamo.${DOMAIN}`)
      - traefik.http.services.dynamo.loadbalancer.server.port=8000
    depends_on:
      - postgres
      - valkey
    deploy:
      resources:
        limits:
          memory: 2G   # Frontend is lightweight; adjust for production
          cpus: '2'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 11. CPU-VLLM (Future) – Placeholder for CPU-optimised vLLM
  # =========================================================================
  # NVIDIA Dynamo now supports CPU-only vLLM container builds via PR #7139.
  # This allows vLLM (normally CUDA-only) to run on CPU nodes with AVX512/
  # AMX_BF16 acceleration. To enable, you must build the CPU-optimised image
  # from source and uncomment the service below.
  #
  # Build instructions (example):
  #   git clone https://github.com/ai-dynamo/dynamo.git
  #   cd dynamo
  #   docker build -f Dockerfile.cpu -t nettrades-cpu-vllm:latest .
  #
  # Then replace the 'dynamo' service above with this one, or run as a separate
  # worker. For production, you may also pre-build and host the image on a
  # local registry for faster deployment.
  # =========================================================================
  # cpu-vllm:
  #   image: nettrades-cpu-vllm:latest   # Replace with your built image
  #   container_name: cpu-vllm
  #   restart: unless-stopped
  #   networks:
  #     - internal
  #   volumes:
  #     - ./dynamo-data/models:/models
  #   environment:
  #     - VLLM_TARGET_DEVICE=cpu
  #     - VLLM_CPU_AVX512=1           # Enable AVX512 if available
  #     - VLLM_CPU_AMXBF16=1          # Enable AMX_BF16 if available
  #   command:
  #     - "--model"
  #     - "/models/${MODEL_NAME:-Qwen2.5-1.5B-Instruct}"
  #     - "--api-key"
  #     - "${DYNAMO_API_KEY}"
  #     - "--host"
  #     - "0.0.0.0"
  #     - "--port"
  #     - "8000"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G
  #         cpus: '4'
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: 10m
  #       max-file: 3

  # =========================================================================
  # 12. LLAMA.CPP – CPU Inference Engine (Fallback, zero dependency)
  # =========================================================================
  # This is the reliable CPU fallback that works immediately without any
  # authentication. If Dynamo is unavailable, requests are routed here.
  # =========================================================================
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./dynamo-data/models:/models  # Share models with Dynamo
    environment:
      - LLAMA_SERVER_MODEL=/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf
      - LLAMA_SERVER_HOST=0.0.0.0
      - LLAMA_SERVER_PORT=8080
      - LLAMA_SERVER_N_GPU_LAYERS=0   # CPU only; adjust for GPU
    ports:
      - "8080:8080"
    command:
      - "-m"
      - "/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Allow time for model loading
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 13. PROMETHEUS - Metrics Collection
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - ./prometheus/web.yml:/etc/prometheus/web.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.config.file=/etc/prometheus/web.yml'
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 14. GRAFANA - Visualisation Dashboard
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =========================================================================
  # 15. NODE EXPORTER - System Metrics for Prometheus
  # =========================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - internal
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # =============================================================================
  # WireGuard Admin VPN Server
  # =============================================================================
  # The WireGuard server provides secure VPN access for administrators.
  # It uses the same configuration as the existing setup scripts.
  # =============================================================================
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      # - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVERURL=${DOMAIN}
      - SERVERPORT=51821
      - PEERS=1
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=10.10.10.0/24
    volumes:
      - /etc/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51821:51821/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  # =============================================================================
  # 16. SELF-IMPROVING SERVICE - Continuous Learning & Fine-Tuning
  # =============================================================================
  self-improving:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.self-improving
    container_name: self-improving
    restart: unless-stopped
    networks:
      - internal
    environment:
      - DATABASE_URL=postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_API_KEY=${ODOO_API_KEY}
      - THRESHOLD_EPISODES=50
      - THRESHOLD_QUALITY=7.0
      - FINE_TUNE_MODEL=${FINE_TUNE_MODEL:-deepseek-1.5b}
      - FINE_TUNE_METHOD=${FINE_TUNE_METHOD:-unsloth}
    volumes:
      - ./dynamo-data/models:/models
      - ./training-data:/training-data
    depends_on:
      postgres:
        condition: service_healthy
      odoo:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3