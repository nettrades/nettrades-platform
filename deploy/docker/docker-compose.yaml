# =============================================================================
# FILE: deploy/docker/docker-compose.yaml
# =============================================================================
# PURPOSE:
#   Defines all services for a single-VM deployment of the NETTRADES platform.
#
# INFERENCE ARCHITECTURE:
#   - Primary: NVIDIA Dynamo (frontend + backend) – GPU-accelerated distributed inference
#   - Fallback: llama.cpp – CPU inference, zero-dependency, works immediately
#   - Odoo provides the governance layer (users, models, GPU resources)
#   - LangGraph (custom app.py + uvicorn) orchestrates agents with state persistence
#   - agent-chat-ui uses API Passthrough for production authentication
# =============================================================================

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  web:
    external: true
  internal:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes – all persistent data uses named volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  dynamo_data:
    driver: local
  valkey_data:
  forgejo_data:
  odoo_data:
  prometheus_data:
  grafana_data:
  langgraph_data:
  llama_cpp_data:

# --------------------------------------------------------------------------
# Services
# --------------------------------------------------------------------------
services:

  # =========================================================================
  # 1. TRAEFIK - Reverse Proxy with Automatic Let's Encrypt SSL
  # =========================================================================
  traefik:
    image: traefik:v3.6.13
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ADMIN_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.websecure.http.tls=true
      - --accesslog
      - --api.insecure=true        #   REMOVE IN PRODUCTION
      - --log.level=DEBUG          #   REMOVE IN PRODUCTION
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/letsencrypt
    networks:
      - web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 2. POSTGRESQL with pgvector - RAG Embeddings & Main Database
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 3. POSTGRES EXPORTER - Prometheus Metrics for PostgreSQL
  # =========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo?sslmode=disable"
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 4. VALKEY - BSD-licensed in-memory store (sessions, ORM cache, bus)
  # =========================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --save 900 1 --save 300 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 5. ODOO 19 CE - ERP, Marketplace, and AI Hub (Governance Layer)
  # =========================================================================
  odoo:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.odoo
    container_name: odoo
    ports:
      - "8069:8069"
    volumes:
      - ./odoo-modules:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
      - ./odoo-logs:/var/log/odoo
    environment:
      - HOST=postgres
      - PORT=5432
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.odoo.rule=Host(`${DOMAIN}`) && PathPrefix(`/odoo`)
      - traefik.http.services.odoo.loadbalancer.server.port=8069
      - traefik.http.middlewares.odoo-strip.stripprefix.prefixes=/odoo
      - traefik.http.routers.odoo.middlewares=odoo-strip
      - traefik.http.middlewares.odoo-ratelimit.ratelimit.average=100
      - traefik.http.routers.odoo.middlewares=odoo-ratelimit
    networks:
      - web
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 6. FORGEJO 15.0 LTS - Self-hosted Git Server
  # =========================================================================
  forgejo:
    image: forgejo/forgejo:15.0
    ports:
      - "3000:3000"
    volumes:
      - forgejo_data:/data
    environment:
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__security__SECRET_KEY=${FORGEJO_SECRET_KEY}
      - FORGEJO__security__INTERNAL_TOKEN=${JWT_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN}`)
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
    networks:
      - web
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 7. LANGGRAPH SERVER - Custom app.py + uvicorn (Full Control)
  # =========================================================================
  # This is the Autonomous Enterprise Platform layer – LangGraph agents with
  # state persistence, checkpointing, and multi-agent orchestration.
  # It uses the Dynamo API for inference, but remains separate from the core
  # inference routing so that customer agents don't break the distributed system.
  # =========================================================================
  langgraph-server:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.langgraph
    container_name: langgraph-server
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - DATABASE_URL=postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Inference backend URLs – dynamically set by deployment script
      - LLM_BASE_URL=${LLM_BASE_URL:-http://dynamo:8000/v1}
      - DYNAMO_API_KEY=${DYNAMO_API_KEY:-dummy}
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-1}
      - ODOO_PASSWORD=${ADMIN_PASSWORD}
      - ODOO_PROXY_URL=${ODOO_PROXY_URL:-http://odoo-proxy:8080}
      - ODOO_API_KEY=${PROXY_API_KEY:-${ODOO_API_KEY}}
      - USE_ODOO_PROXY=${USE_ODOO_PROXY:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # LANGGRAPH_API_URL is used for URL generation (workaround for #7390)
      - LANGGRAPH_API_URL=https://${DOMAIN}/api
      # MOUNT_PREFIX tells LangGraph it's mounted at /api
      - MOUNT_PREFIX=/api
      - LANGGRAPH_TRUST_X_FORWARDED_HEADERS=true
    ports:
      - "8000:8000"
    volumes:
      - langgraph_data:/app/.langgraph
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.langgraph-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.langgraph-api.priority=100
      - traefik.http.routers.langgraph-api.service=langgraph-api@docker
      - traefik.http.routers.langgraph-api.entrypoints=web,websecure
      - traefik.http.routers.langgraph-api.tls=true
      - traefik.http.services.langgraph-api.loadbalancer.server.port=8000
      # stripPrefix so LangGraph sees /health instead of /api/health
      - traefik.http.middlewares.langgraph-strip.stripprefix.prefixes=/api
      # Forward headers so LangGraph knows it's behind a proxy
      - traefik.http.middlewares.langgraph-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.langgraph-headers.headers.customrequestheaders.X-Forwarded-Host=${DOMAIN}
      - traefik.http.routers.langgraph-api.middlewares=langgraph-strip,langgraph-headers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
      - valkey
      - odoo-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 8. AGENT CHAT UI - Next.js Frontend with API Passthrough
  # =========================================================================
  # API Passthrough is the production pattern where the Next.js server proxies
  # requests to LangGraph, avoiding client-side API keys and CORS issues.
  # This is the recommended approach for production deployments.
  # =========================================================================
  agent-chat-ui:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent-chat-ui
      args:
        # API Passthrough: the Next.js server proxies requests to LangGraph
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_ASSISTANT_ID: supervisor
        NEXT_PUBLIC_SKIP_AUTH: "false"
        NEXT_PUBLIC_AUTH_SCHEME: langgraph-api-key
        NEXT_PUBLIC_LANGGRAPH_API_KEY: ${LANGGRAPH_API_KEY}
        # These are used internally by the Next.js server for proxying
        LANGGRAPH_API_URL: http://langgraph-server:8000
        LANGSMITH_API_KEY: ${LANGGRAPH_API_KEY}
    container_name: agent-chat-ui
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
      - NEXT_PUBLIC_ASSISTANT_ID=supervisor
      - NEXT_PUBLIC_AUTH_SCHEME=langgraph-api-key
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY}
      - HOST=0.0.0.0
      # Server-side environment variables for API Passthrough
      - LANGGRAPH_API_URL=http://langgraph-server:8000
      - LANGSMITH_API_KEY=${LANGGRAPH_API_KEY}
    ports:
      - "3002:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-chat-ui.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.agent-chat-ui.priority=50
      - traefik.http.services.agent-chat-ui.loadbalancer.server.port=3000
      - traefik.http.routers.agent-chat-ui.entrypoints=web,websecure
      - traefik.http.routers.agent-chat-ui.tls=true
    depends_on:
      - langgraph-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 9. ODOO PROXY - HTTP JSON-RPC Shim
  # =========================================================================
  odoo-proxy:
    build: ../../src/core/odoo_proxy
    container_name: odoo-proxy
    restart: unless-stopped
    networks:
      - internal
    environment:
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-1}
      - ODOO_PASSWORD=${ADMIN_PASSWORD}
      - PROXY_API_KEY=${PROXY_API_KEY:-${ODOO_API_KEY}}
      - ODOO_API_KEY=${PROXY_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8090:8080"
    depends_on:
      - odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 10. NVIDIA DYNAMO – Primary GPU Inference Engine (replaces GPUStack)
  # =========================================================================
  # Dynamo is a production-grade distributed inference runtime that includes
  # vLLM. It provides:
  #   - Disaggregated serving (prefill/decode separation)
  #   - KV cache-aware routing
  #   - Built-in fault tolerance and health checking
  #   - OpenAI-compatible API
  # This is the Sovereign AI layer – it handles all GPU routing and inference.
  #
  # For CPU-ONLY testing, we use the dynamo-frontend
  # container which is lightweight and requires no GPU. It provides the same
  # OpenAI-compatible API with mock workers, allowing full orchestration testing.
  # When a GPU becomes available, switch to the GPU runtime images:
  #   - nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.0
  #   - nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.2.0
  # =========================================================================
  dynamo:
    # CPU-compatible frontend for testing (no GPU required)
    image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.2.1
    container_name: dynamo
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "8001:8000"  # Expose to host for debugging
    volumes:
      - ./dynamo-data/models:/models
      - dynamo_data:/var/lib/dynamo
    environment:
      - OPENAI_API_KEY=${DYNAMO_API_KEY}
    # - MODEL_PATH=/models/${MODEL_NAME:-Qwen2.5-1.5B-Instruct}
      - DYNAMO_LOG_LEVEL=info
    # Frontend command with file-based discovery (no etcd needed)
    command:
      - "python3"
      - "-m"
      - "dynamo.frontend"
      - "--http-port"
      - "8000"
      - "--discovery-backend"
      - "file"
    labels:
      - traefik.enable=true
      - traefik.http.routers.dynamo.rule=Host(`dynamo.${DOMAIN}`)
      - traefik.http.services.dynamo.loadbalancer.server.port=8000
    depends_on:
      - postgres
      - valkey
    deploy:
      resources:
        limits:
          memory: 2G   # Frontend is lightweight; adjust for production
          cpus: '2'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 11. CPU-VLLM (Future) – Placeholder for CPU-optimised vLLM
  # =========================================================================
  # NVIDIA Dynamo now supports CPU-only vLLM container builds via PR #7139.
  # This allows vLLM (normally CUDA-only) to run on CPU nodes with AVX512/
  # AMX_BF16 acceleration. To enable, you must build the CPU-optimised image
  # from source and uncomment the service below.
  #
  # Build instructions (example):
  #   git clone https://github.com/ai-dynamo/dynamo.git
  #   cd dynamo
  #   docker build -f Dockerfile.cpu -t nettrades-cpu-vllm:latest .
  #
  # Then replace the 'dynamo' service above with this one, or run as a separate
  # worker. For production, you may also pre-build and host the image on a
  # local registry for faster deployment.
  # =========================================================================
  # cpu-vllm:
  #   image: nettrades-cpu-vllm:latest   # Replace with your built image
  #   container_name: cpu-vllm
  #   restart: unless-stopped
  #   networks:
  #     - internal
  #   volumes:
  #     - ./dynamo-data/models:/models
  #   environment:
  #     - VLLM_TARGET_DEVICE=cpu
  #     - VLLM_CPU_AVX512=1           # Enable AVX512 if available
  #     - VLLM_CPU_AMXBF16=1          # Enable AMX_BF16 if available
  #   command:
  #     - "--model"
  #     - "/models/${MODEL_NAME:-Qwen2.5-1.5B-Instruct}"
  #     - "--api-key"
  #     - "${DYNAMO_API_KEY}"
  #     - "--host"
  #     - "0.0.0.0"
  #     - "--port"
  #     - "8000"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G
  #         cpus: '4'
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # =========================================================================
  # 12. LLAMA.CPP – CPU Inference Engine (Fallback, zero dependency)
  # =========================================================================
  # This is the reliable CPU fallback that works immediately without any
  # authentication. If Dynamo is unavailable, requests are routed here.
  # =========================================================================
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./dynamo-data/models:/models  # Share models with Dynamo
    environment:
      - LLAMA_SERVER_MODEL=/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf
      - LLAMA_SERVER_HOST=0.0.0.0
      - LLAMA_SERVER_PORT=8080
      - LLAMA_SERVER_N_GPU_LAYERS=0   # CPU only; adjust for GPU
    ports:
      - "8080:8080"
    command:
      - "-m"
      - "/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 13. PROMETHEUS - Metrics Collection
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - ./prometheus/web.yml:/etc/prometheus/web.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.config.file=/etc/prometheus/web.yml'
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 14. GRAFANA - Visualisation Dashboard
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 15. NODE EXPORTER - System Metrics for Prometheus
  # =========================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - internal
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"