# =============================================================================
# FILE: deploy/docker/docker-compose.yaml
# =============================================================================
# PURPOSE:
#   Defines all services for a single-VM deployment of the NETTRADES platform.
#
# SERVICES:
#   - Traefik: Reverse proxy with automatic Let's Encrypt SSL
#   - PostgreSQL 17 with pgvector: RAG embeddings & main database
#   - Postgres Exporter: Prometheus metrics for PostgreSQL
#   - Valkey 8: BSD-licensed in-memory store (sessions, ORM cache, bus)
#   - Odoo 19 CE: ERP, Marketplace, and AI Hub
#   - Forgejo 15.0 LTS: Self-hosted Git server
#   - LangGraph Agent: Durable AI orchestration
#   - agent-chat-ui: Next.js chat interface for LangGraph agents
#   - Odoo Proxy: HTTP JSON-RPC shim (replaces mcp-odoo)
#   - GPUStack: GPU management and inference (replaces standalone vLLM/llama.cpp)
#   - Prometheus: Metrics collection
#   - Grafana: Visualisation
#   - Node Exporter: System metrics for Prometheus
#
# KEY FEATURES:
#   - All services are production-ready with pinned versions.
#   - Forgejo 15.0 LTS is supported until July 2027.
#   - GPUStack v2.1.2 is the current stable release.
#   - Valkey 8 replaces Redis for session storage, ORM cache, and bus notifications.
#   - GPUStack's built-in Prometheus and Grafana are DISABLED on the central
#     deployment. Metrics are scraped by the external Prometheus and visualised
#     in the external Grafana.
#   - Client companies running their own GPUStack server (Trusted Mode) retain
#     the built-in Grafana for anonymous Viewer access to GPU-level dashboards.
#   - agent-chat-ui is the primary user interface for the platform.
#   - LangGraph Server is configured via langgraph.json.
#
# MODIFICATIONS:
#   - Added new self-improving modules to Odoo addons_path.
#   - Added bridge module for hub-and-spoke routing.
#   - Added data collection, trigger, and loop modules.
#   - Added fairness module to Odoo addons.
#   - Updated environment variables for fairness evaluation.
#   - Replaced mcp-odoo with odoo-proxy service.
#   - Added node_exporter for system-level metrics.
#   - Fixed PostgreSQL volume mount for pg17 compatibility.
#   - Fixed build contexts for langgraph and odoo-proxy.
#   - Converted all stateful bind mounts to named Docker volumes for portability
#     and to avoid permission issues. This aligns with Kubernetes best practices.
#
# =============================================================================

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  web:
    external: true
  internal:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes – all persistent data uses named volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  gpustack_data:
    driver: local
  valkey_data:
  forgejo_data:
  odoo_data:
  prometheus_data:
  grafana_data:
  langgraph_data:
# --------------------------------------------------------------------------
# Services
# --------------------------------------------------------------------------
services:

  # =========================================================================
  # 1. TRAEFIK - Reverse Proxy with Automatic Let's Encrypt SSL
  # =========================================================================
  traefik:
    image: traefik:v3.6.13
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ADMIN_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/letsencrypt
    networks:
      - web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 2. POSTGRESQL with pgvector - RAG Embeddings & Main Database
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # FIXED: Mount to /var/lib/postgresql (not /data) for PostgreSQL 17+ compatibility
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 3. POSTGRES EXPORTER - Prometheus Metrics for PostgreSQL
  # =========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo?sslmode=disable"
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 4. VALKEY - BSD-licensed in-memory store (sessions, ORM cache, bus)
  # =========================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --save 900 1 --save 300 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 5. ODOO 19 CE - ERP, Marketplace, and AI Hub
  # =========================================================================
  odoo:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.odoo
    container_name: odoo
    ports:
      - "8069:8069"
    volumes:
      - ./odoo-modules:/mnt/extra-addons              # <-- mount the prepared addons
      - odoo_data:/var/lib/odoo                   # persistent data (named volume)
      - ./odoo-logs:/var/log/odoo                 # logs (bind mount – optional)
    environment:
      - HOST=postgres
      - PORT=5432
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Fairness evaluation API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    labels:
      - traefik.enable=true
      # Route to /odoo path on the main domain
      - traefik.http.routers.odoo.rule=Host(`${DOMAIN}`) && PathPrefix(`/odoo`)
      - traefik.http.services.odoo.loadbalancer.server.port=8069
      # Strip the /odoo prefix before forwarding to Odoo
      - traefik.http.middlewares.odoo-strip.stripprefix.prefixes=/odoo
      - traefik.http.routers.odoo.middlewares=odoo-strip
      - traefik.http.middlewares.odoo-ratelimit.ratelimit.average=100
      - traefik.http.routers.odoo.middlewares=odoo-ratelimit
    networks:
      - web
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 6. FORGEJO 15.0 LTS - Self-hosted Git Server
  # =========================================================================
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0
    ports:
      - "3000:3000"
    volumes:
      - forgejo_data:/data
    environment:
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__security__SECRET_KEY=${FORGEJO_SECRET_KEY}
      - FORGEJO__security__INTERNAL_TOKEN=${JWT_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN}`)
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
    networks:
      - web
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 7. LANGGRAPH SERVER - Durable AI Orchestration  
  # REMOVE - DISABLE_AUTH=true IN PRODUCTION 
  # AND REMOVE - STEP 1: AUTHENTICATION (can be disabled with DISABLE_AUTH=true) BLOCK FROM APP.PY IN PRODUCTION
  # AND IN PRODUCTION REMOVE           NEXT_PUBLIC_SKIP_AUTH: "true" IN agent-chat-ui:   BLOCK BELOW
  # =========================================================================
  langgraph-server:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.langgraph
    image: langgraph-server:latest
    container_name: langgraph-server
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - DATABASE_URL=postgresql://odoo:${POSTGRES_PASSWORD}@postgres:5432/odoo
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://gpustack:8080/v1}
      - GPUSTACK_API_KEY=${GPUSTACK_API_KEY:-}
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-1}
      - ODOO_PASSWORD=${ADMIN_PASSWORD}
      - ODOO_PROXY_URL=${ODOO_PROXY_URL:-http://odoo-proxy:8080}
      - ODOO_API_KEY=${PROXY_API_KEY:-${ODOO_API_KEY}}
      - USE_ODOO_PROXY=${USE_ODOO_PROXY:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    volumes:
      - langgraph_data:/app/.langgraph
    labels:
      - traefik.enable=true
      - traefik.http.routers.langgraph-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.langgraph-api.priority=100
      - traefik.http.services.langgraph-api.loadbalancer.server.port=8000
      - traefik.http.middlewares.langgraph-strip.stripprefix.prefixes=/api
      - traefik.http.routers.langgraph-api.middlewares=langgraph-strip
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3  
    depends_on:
      - postgres
      - valkey
      - odoo-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 8. AGENT CHAT UI - Next.js Frontend for LangGraph
  # IN PRODUCTION REMOVE           NEXT_PUBLIC_SKIP_AUTH: "true"
  # =========================================================================
  agent-chat-ui:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent-chat-ui
      args:
        NEXT_PUBLIC_API_URL: http://${DOMAIN}/api
        NEXT_PUBLIC_ASSISTANT_ID: supervisor
        NEXT_PUBLIC_SKIP_AUTH: "false"
        NEXT_PUBLIC_LANGGRAPH_API_KEY: ${LANGGRAPH_API_KEY}
    image: agent-chat-ui:latest
    container_name: agent-chat-ui
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      # NEXT_PUBLIC_API_URL is already set at build time; no need to set it here
      - NEXT_PUBLIC_ASSISTANT_ID=supervisor
      - NEXT_PUBLIC_AUTH_SCHEME=
      - LANGGRAPH_API_KEY=${LANGGRAPH_API_KEY}
    ports:
      - "3002:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-chat-ui.rule=PathPrefix(`/`)
      - "traefik.http.routers.agent-chat-ui.priority=50"
      - traefik.http.services.agent-chat-ui.loadbalancer.server.port=3000
    # healthcheck removed
    depends_on:
      - langgraph-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 9. ODOO PROXY - HTTP JSON-RPC Shim (NEW – replaces mcp-odoo)
  # =========================================================================
  odoo-proxy:
    # FIXED: Correct build context path
    build: ../../src/core/odoo_proxy
    image: odoo-proxy:latest
    container_name: odoo-proxy
    restart: unless-stopped
    networks:
      - internal
    environment:
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-1}
      - ODOO_PASSWORD=${ADMIN_PASSWORD}
      - PROXY_API_KEY=${PROXY_API_KEY:-${ODOO_API_KEY}}
      - ODOO_API_KEY=${PROXY_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8090:8080"
    depends_on:
      - odoo
    healthcheck:                          # <-- this must be outside of logging
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 10. GPUStack – GPU Management and Inference (replaces standalone engines)
  # =========================================================================

  gpustack:
    image: gpustack/gpustack:latest
    container_name: gpustack
    command: ["--bootstrap-password", "${GPUSTACK_ADMIN_PASSWORD}"]
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - GPUSTACK_ADMIN_PASSWORD=${GPUSTACK_ADMIN_PASSWORD}   # <-- Add this
      - GPUSTACK_JWT_SECRET=${GPUSTACK_JWT_SECRET}
      - GPUSTACK_GRAFANA_URL=https://grafana.${DOMAIN}
      - GPUSTACK_MODEL_DIR=/models
    ports:
      - "8080:80"
    volumes:
      - gpustack_data:/var/lib/gpustack      # named volume
      - ./gpustack-data/models:/models       # optional bind mount
    labels:
      - traefik.enable=true
      - traefik.http.routers.gpustack.rule=Host(`gpustack.${DOMAIN}`)
      - traefik.http.services.gpustack.loadbalancer.server.port=80
    depends_on:
      - postgres
      - valkey
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # =========================================================================
  # 11. LLAMA.CPP – CPU Inference Engine (Fallback)
  # =========================================================================
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp
    restart: unless-stopped
    networks:
      - internal
    volumes:
      # Re-use the model from gpustack-data/models (already downloaded)
      - ./gpustack-data/models:/models
    environment:
      - LLAMA_SERVER_MODEL=/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf
      - LLAMA_SERVER_HOST=0.0.0.0
      - LLAMA_SERVER_PORT=8080
      - LLAMA_SERVER_N_GPU_LAYERS=0   # CPU only; adjust for GPU
    ports:
      - "8080:8080"
    command:
      - "-m"
      - "/models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 12. PROMETHEUS - Metrics Collection
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml      # config (bind)
      - prometheus_data:/prometheus                           # data (named volume)
      - ./prometheus/web.yml:/etc/prometheus/web.yml          # auth (bind)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.config.file=/etc/prometheus/web.yml'
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 13. GRAFANA - Visualisation Dashboard
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - web
      - internal
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana                         # data (named volume)
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards   # config (bind)
      - ./grafana-datasources:/etc/grafana/provisioning/datasources # config (bind)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # 14. NODE EXPORTER - System Metrics for Prometheus
  # =========================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - internal
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"