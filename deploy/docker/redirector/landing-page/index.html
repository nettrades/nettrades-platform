<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETTRADES AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4fc3f7;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #aaa;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .links a {
            display: block;
            padding: 12px 20px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .links a:hover {
            background: #1565c0;
        }
        .links a.secondary {
            background: #2a2a4a;
        }
        .links a.secondary:hover {
            background: #3a3a5a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 NETTRADES AI</h1>
        <p>Your Sovereign AI Platform</p>
        <div class="links">
            <a href="/odoo">📊 Odoo ERP</a>
            <a href="http://${DOMAIN}:3002">💬 AI Chat UI</a>
            <a href="http://${DOMAIN}:3001">📈 Grafana</a>
            <a href="http://${DOMAIN}:9090">🔎 Prometheus</a>
            <a href="http://${DOMAIN}:8080">🦙 llama.cpp</a>
            <a href="#" class="secondary">⚙️ Settings (coming soon)</a>
        </div>
        <p style="margin-top: 2rem; font-size: 0.8rem; color: #666;">
            To change this page, edit <code>DEFAULT_LANDING_PAGE</code> in <code>.env</code>.
        </p>
    </div>
</body>
</html>
