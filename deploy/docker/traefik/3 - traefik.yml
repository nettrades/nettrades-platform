# Traefik Configuration File
# Place this in: deploy/docker/traefik/traefik.yml
# This file sets up HTTPS, security headers, and other production settings

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# =============================================================================
# ENTRY POINTS (ports and protocols)
# =============================================================================
entryPoints:
  web:
    address: ":80"
    # Redirect HTTP to HTTPS
    http:
      redirections:
        entrypoint:
          regex: "^http://(.*)$"
          replacement: "https://$1"
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt  # Use Let's Encrypt for HTTPS
        options: modern

# =============================================================================
# PROVIDERS (where Traefik discovers services)
# =============================================================================
providers:
  # Docker provider - discovers services from Docker labels
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: web  # Only route services on this network

  # File provider for static configuration (optional)
  file:
    filename: /traefik/dynamic.yml
    watch: true

# =============================================================================
# API & DASHBOARD
# =============================================================================
api:
  insecure: true  # Allow access to dashboard without authentication
  dashboard: true
  # NOTE: In production, use basic auth or remove this section entirely

# =============================================================================
# HTTPS CERTIFICATES (Let's Encrypt)
# =============================================================================
certificatesResolvers:
  letsencrypt:
    acme:
      # Let's Encrypt server
      server: https://acme-v02.api.letsencrypt.org/directory
      # For testing (doesn't require valid email):
      # server: https://acme-staging-v02.api.letsencrypt.org/directory
      
      # Your email for certificate renewal notifications
      email: admin@nettrades.ai
      # UPDATE: Change to your actual email
      
      # Certificate storage
      storage: /acme.json
      
      # HTTP challenge for certificate validation
      httpChallenge:
        entryPoint: web

# =============================================================================
# LOG CONFIGURATION
# =============================================================================
log:
  level: INFO
  # For debugging routing issues, change to DEBUG
  # level: DEBUG

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop

# =============================================================================
# METRICS & MONITORING (optional)
# =============================================================================
# Uncomment if you want Prometheus metrics
# metrics:
#   prometheus:
#     entryPoint: metrics
#     addEntryPointsLabels: true
#     addServicesLabels: true

# =============================================================================
# TRACING (optional)
# =============================================================================
# Uncomment if you want distributed tracing
# tracing:
#   jaeger:
#     samplingServerURL: http://jaeger:6831
#     localAgentHostPort: jaeger:6831

# =============================================================================
# TLS OPTIONS FOR DIFFERENT SECURITY LEVELS
# =============================================================================
# These are referenced in entry points above
tlsOptions:
  modern:
    # Modern TLS configuration (strong security, good compatibility)
    minVersion: VersionTLS13
    cipherSuites:
      - TLS_AES_128_GCM_SHA256
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
