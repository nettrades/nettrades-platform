# =============================================================================
# NETTRADES.AI – Odoo 19 CE Configuration (final)
# =============================================================================
# This file is read by Odoo at startup.  Secrets are substituted from .env.
# To apply changes, restart the Odoo container:
#   docker compose restart odoo
# =============================================================================
[options]
admin_passwd = admin
csv_internal_sep = ,
data_dir = c:\users\owner\appdata\local\openerp s.a\odoo
db_app_name = odoo-{pid}
db_host = localhost
db_maxconn = 64
db_maxconn_gevent = None
db_password = Password123
db_port = 5432
db_replica_host = None
db_replica_port = None
db_sslmode = prefer
db_template = template1
db_user = odoo
dbfilter =
email_from =
from_filter =
gevent_port = 8072
http_enable = True
http_interface = 0.0.0.0
http_port = 8069
limit_memory_soft = 2147483648
limit_time_real = 120
limit_time_real_cron = -1
limit_time_worker_cron = 0
list_db = True
log_db =
log_db_level = warning
log_handler = :INFO
max_cron_threads = 2
osv_memory_count_limit = 0
pg_path =
pidfile =
pre_upgrade_scripts =
proxy_mode = False
reportgz = False
screencasts =
screenshots = c:\users\owner\appdata\local\temp\odoo_tests
server_wide_modules = base,rpc,web
skip_auto_install = False
smtp_password =
smtp_port = 25
smtp_server = localhost
smtp_ssl = False
smtp_ssl_certificate_filename =
smtp_ssl_private_key_filename =
smtp_user =
syslog = False
transient_age_limit = 1.0
unaccent = False
upgrade_path =
websocket_keep_alive_timeout = 3600
websocket_rate_limit_burst = 10
websocket_rate_limit_delay = 0.2
with_demo = False
x_sendfile = False


# Addons path: third-party Odoo core + NETTRADES custom Odoo modules
addons_path = ./odoo-modules,./third-party/odoo/addons,./third-party/odoo_llm,./third-party/odoo_llm_compat,./third-party/payment_stripe_ce,./third-party/website_sale_marketplace

# Sessions, ORM cache, bus → Valkey (BSD-3-Clause, Redis-compatible)
session_store = redis
session_store_url = redis://valkey:6379
ormcache_redis_url = redis://valkey:6379/1

workers = 4
db_name = nettrades
log_level = info
logfile = /var/log/odoo/odoo.log