# =============================================================================
# NETTRADES.AI – Odoo 19 CE Configuration (final)
# =============================================================================
# This file is read by Odoo at startup.  Secrets are substituted from .env.
# To apply changes, restart the Odoo container:
#   docker compose restart odoo
#
# On a development environment:
# set "workers = 0" as it will then run Odoo in single‑process mode – the only mode that works on Windows.
# Removing the Redis lines forces Odoo to use its built‑in file‑based session handler.
# The addons_path should point to your local directories
#
# db_app_name = odoo-{pid} setting is optional and only relevant when Odoo spawns multiple database connections (e.g., when workers > 0).
# It sets the application name reported to PostgreSQL – helpful for debugging connection pools, but never required.
# If you are running with workers = 0 (single process), this line has no effect. You can leave it as is, comment it out, or delete it – it will not affect login or functionality.
# FILE: deploy/docker/config/odoo.conf
#
# PURPOSE:
#   This file configures the Odoo 19 CE instance for the NETTRADES platform.
#   It sets database connection, addons path, and worker settings.
#
# MODIFICATIONS:
#   - Added all new self-improving modules to addons_path
#   - Added bridge module for hub-and-spoke routing
#   - Added nettrades_fairness to addons_path
# =============================================================================
[options]
admin_passwd = admin
csv_internal_sep = ,
data_dir = C:/Users/Owner/AppData/Local/OpenERP S.A/Odoo
db_app_name = odoo-{pid}
db_host = localhost
db_maxconn = 64
db_maxconn_gevent = None
db_password = Password123
db_port = 5432
db_replica_host = None
db_replica_port = None
db_sslmode = prefer
db_template = template1
db_user = odoo
dbfilter =
email_from =
from_filter =
gevent_port = 8072
http_enable = True
http_interface = 0.0.0.0
http_port = 8069
limit_memory_hard = 2147483648
limit_memory_soft = 2147483648
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = -1
limit_time_worker_cron = 0
list_db = True
log_db =
log_db_level = warning
log_handler = :INFO
max_cron_threads = 2
osv_memory_count_limit = 0
pg_path =
pidfile =
pre_upgrade_scripts =
proxy_mode = False
reportgz = False
screencasts =
screenshots = C:/Users/Owner/AppData/Local/Temp/odoo_tests
server_wide_modules = base,rpc,web
skip_auto_install = False
smtp_password =
smtp_port = 25
smtp_server = localhost
smtp_ssl = False
smtp_ssl_certificate_filename =
smtp_ssl_private_key_filename =
smtp_user =
syslog = False
transient_age_limit = 1.0
unaccent = False
upgrade_path =
websocket_keep_alive_timeout = 3600
websocket_rate_limit_burst = 10
websocket_rate_limit_delay = 0.2
with_demo = False
x_sendfile = False


# Addons path: third-party Odoo core + NETTRADES custom Odoo modules
addons_path = ./odoo-modules,./odoo-modules/nettrades_core,./odoo-modules/nettrades_good_answer,./odoo-modules/nettrades_ask_someone,./odoo-modules/nettrades_gpu_admin,./odoo-modules/nettrades_gpustack_adapter,./odoo-modules/nettrades_queue,./odoo-modules/nettrades_onboarding,./odoo-modules/nettrades_job_matching,./odoo-modules/nettrades_proposals,./odoo-modules/nettrades_lead_scoring,./odoo-modules/nettrades_research,./odoo-modules/nettrades_chatbot,./odoo-modules/nettrades_notifications,./odoo-modules/nettrades_pwa,./odoo-modules/nettrades_bridge,./odoo-modules/nettrades_data_collection,./odoo-modules/nettrades_trigger,./odoo-modules/nettrades_loop,./odoo-modules/nettrades_self_improving_config,./odoo-modules/nettrades_fairness,./third-party/,./third-party/mcp-odoo,./third-party/odoo/addons,./third-party/odoo_llm,./third-party/odoo_llm_compat,./third-party/website_sale_marketplace,./third-party/queue/queue_job

# Sessions, ORM cache, bus → Valkey (BSD-3-Clause, Redis-compatible), enable session_store, session_store_url, ormcache_redis_url when you have Valkey enabled
# For the development Environment disable all external session/ORM cache stores
# session_store = redis
# session_store_url = redis://valkey:6379
# ormcache_redis_url = redis://valkey:6379/1

# Windows development environment requires single process
workers = 0

# Later as you scale you could have more workers
# workers = 4
db_name = nettrades
# Logging
log_level = info
logfile = /var/log/odoo/odoo.log

