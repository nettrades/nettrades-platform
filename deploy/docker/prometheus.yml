# =============================================================================
# NETTRADES.AI – Prometheus scrape configuration
# =============================================================================
# All endpoints are internal to the Docker Compose network or Kubernetes
# cluster and require no authentication in production.
#
# UPDATES (2026-07-29):
#   - Removed GPUStack scrape targets (replaced by NVIDIA Dynamo).
#   - Added placeholder for Dynamo metrics (currently none exposed).
# =============================================================================
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'llama-cpp'
    static_configs:
      - targets: ['llama-cpp:8080']

  - job_name: 'odoo'
    static_configs:
      - targets: ['odoo:8069']

  - job_name: 'langgraph'
    static_configs:
      - targets: ['langgraph:8000']

  # (Optional) Add Dynamo metrics when confirmed.
  # - job_name: 'dynamo'
  #   static_configs:
  #     - targets: ['dynamo:8000']