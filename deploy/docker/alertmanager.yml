# File: deploy/docker/alertmanager.yml
route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 4h
  routes:
    - match: { severity: critical }
      receiver: 'critical'
      continue: false
    - match: { severity: warning }
      receiver: 'warning'

receivers:
  - name: 'default'
  - name: 'critical'
    # Configure email/webhook/pagerduty here when ready
  - name: 'warning'
    # Configure email here when ready