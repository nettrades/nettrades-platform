# =============================================================================
# NETTRADES.AI – Prometheus scrape configuration
# =============================================================================
# All endpoints are internal to the Docker Compose network or Kubernetes
# cluster and require no authentication in production.
# =============================================================================
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'llama-cpp'
    static_configs:
      - targets: ['llama-cpp:8080']

  - job_name: 'odoo'
    static_configs:
      - targets: ['odoo:8069']

  - job_name: 'langgraph'
    static_configs:
      - targets: ['langgraph:8000']

  # ---- GPUStack (corrected) ----
  # GPUStack exposes Prometheus metrics on port 10161, not port 80.
  # The /metrics endpoint returns server-level metrics.
  - job_name: 'gpustack'
    static_configs:
      - targets: ['gpustack:10161']

  # GPUStack worker aggregation endpoint – path MUST include trailing slash.
  - job_name: 'gpustack-workers'
    static_configs:
      - targets: ['gpustack:10151']
    metrics_path: '/metrics/'