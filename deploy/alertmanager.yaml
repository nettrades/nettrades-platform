# =============================================================================
# Section: C – Alertmanager configuration
# Purpose:  Route alerts to email (or other receivers).
#           Replace placeholders with actual SMTP credentials.
# =============================================================================
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      - to: 'admin@nettrades.ai'
        from: 'alertmanager@nettrades.ai'
        smarthost: 'smtp.your-email-provider.com:587'
        auth_username: 'alertmanager@nettrades.ai'
        auth_password: 'your-smtp-password'
        require_tls: true

# Uncomment to add Slack or other receivers
