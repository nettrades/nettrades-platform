# =============================================================================
# FILE: .github/workflows/ci-cd.yml
# =============================================================================
# PURPOSE:
#   Continuous Integration pipeline for the NETTRADES platform.
#   Runs on every push to main/dev-deployment1 and on every pull request
#   to main.
#
#   This workflow validates the code. It does NOT deploy automatically.
#   Automatic deployment is intentionally disabled until servers exist.
#   When you are ready to enable automatic deployment, uncomment the
#   deploy-staging job below and add the required secrets.
#
#   Manual deployment is handled by .github/workflows/deploy.yml.
#
# BRANCHING STRATEGY:
#   - main:              Stable, production-ready code. Enterprise customers clone this.
#   - dev-deployment1:   Active development branch. All PRs target this.
#
# STATUS (2026-09):
#   - Lint, security, and build jobs are ACTIVE.
#   - Deploy jobs are COMMENTED OUT (no servers yet).
#   - Slack notification is COMMENTED OUT (no webhook yet).
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev-deployment1 ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  # =========================================================================
  # 1. LINT AND QUALITY CHECKS
  # =========================================================================
  lint:
    name: Lint & Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8 shellcheck-py

      - name: Run pre-commit hooks
        run: pre-commit run --all-files || true

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh || true

      - name: Check Python formatting
        run: black --check --diff . || true

      - name: Check Python imports
        run: isort --check --diff . || true

  # =========================================================================
  # 2. SECURITY SCANNING (Trivy + Dependency Review)
  # =========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  # =========================================================================
  # 3. BUILD IMAGES
  # =========================================================================
  # NOTE: This job builds Docker images for validation only. It does not
  # push them to a registry. To enable registry push, add a login step
  # and set push: true.
  #
  # NOTE: The build context below assumes ./src/core/Dockerfile exists.
  # If your LangGraph Dockerfile is elsewhere, update the context and
  # file paths accordingly.
  # =========================================================================
  build:
    name: Build LangGraph Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LangGraph image
        uses: docker/build-push-action@v6
        with:
          context: ./src/core
          file: ./src/core/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-langgraph:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
