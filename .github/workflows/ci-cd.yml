# =============================================================================
# NETTRADES.AI – CI/CD Pipeline
# =============================================================================
# FILE: .github/workflows/ci-cd.yml
#
# PURPOSE:
#   This workflow automates the build, test, and deployment of the
#   NETTRADES platform. It runs on every push and can be triggered
#   manually for releases.
#
# WORKFLOW STAGES:
#   1. Lint & Validate – Check code quality
#   2. Build – Build Docker images
#   3. Test – Run unit and integration tests
#   4. Deploy – Deploy to staging/production
#
# =============================================================================

name: NETTRADES.AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
  release:
    types:
      - created
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nettrades/nettrades-platform

jobs:
  # ===========================================================================
  # Stage 1: Lint & Validate
  # ===========================================================================
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flake8 black isort mypy pylint

      - name: Lint Python code
        run: |
          flake8 src/ odoo-modules/ --count --max-complexity=10 --statistics
          black --check src/ odoo-modules/
          isort --check-only src/ odoo-modules/

      - name: Validate Odoo manifests
        run: |
          for manifest in odoo-modules/*/__manifest__.py; do
            echo "Validating $manifest"
            python -c "import ast; ast.parse(open('$manifest').read())"
          done

  # ===========================================================================
  # Stage 2: Build
  # ===========================================================================
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Odoo image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.odoo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push LangGraph image
        uses: docker/build-push-action@v5
        with:
          context: src/core
          file: src/core/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-langgraph:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Stage 3: Test
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        test_type: [unit, integration]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-xdist
          pip install -r src/core/requirements.txt

      - name: Run unit tests
        if: matrix.test_type == 'unit'
        run: |
          pytest src/core/tests/ --cov=src --cov-report=xml

      - name: Run integration tests
        if: matrix.test_type == 'integration'
        run: |
          docker compose -f deploy/docker/docker-compose.test.yaml up -d
          sleep 30
          pytest tests/integration/ --cov=src --cov-report=xml
          docker compose -f deploy/docker/docker-compose.test.yaml down

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: ${{ matrix.test_type }}
          name: codecov-${{ matrix.test_type }}

  # ===========================================================================
  # Stage 4: Deploy
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          kubectl set image deployment/odoo odoo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n frontend
          kubectl rollout status deployment/odoo -n frontend --timeout=5m

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'release'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > $HOME/.kube/config

      - name: Apply production manifests
        run: |
          kubectl apply -f deploy/kubernetes/ -R

      - name: Update images
        run: |
          kubectl set image deployment/odoo odoo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} -n frontend
          kubectl rollout status deployment/odoo -n frontend --timeout=10m

  # ===========================================================================
  # Stage 5: Notify
  # ===========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            Deployment status: ${{ job.status }}
            Environment: ${{ github.event_name == 'release' && 'Production' || 'Staging' }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}