# =============================================================================
# FILE: .github/workflows/ci-cd.yml
# =============================================================================
# PURPOSE:
#   CI/CD pipeline for the NETTRADES platform.
#   This workflow builds, tests, and deploys the platform using the SAME
#   phase-based scripts that users run manually. This ensures the deployment
#   scripts are validated in CI before they reach production.
#
#   DESIGN CHOICE:
#   For staging and production, we use SSH + nettrades-setup.sh, which
#   exercises the full setup logic (Phase 0, 1, 2, 5). This is the simplest
#   and most testable approach for a new project.
#
#   Kubernetes (Phase 4) is **commented out** for future use. When you are
#   ready to migrate to Kubernetes, uncomment the relevant jobs (search for
#   "KUBERNETES") and follow the instructions inside.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1
  PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}

jobs:
  # =========================================================================
  # 1. LINT AND QUALITY CHECKS
  # =========================================================================
  lint:
    name: Lint & Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8 shellcheck-py

      - name: Run pre-commit hooks
        run: pre-commit run --all-files || true

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh || true

      - name: Check Python formatting
        run: black --check --diff . || true

      - name: Check Python imports
        run: isort --check --diff . || true

  # =========================================================================
  # 2. SECURITY SCANNING (Trivy + Dependency Review)
  # =========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  # =========================================================================
  # 3. BUILD IMAGES
  # =========================================================================
  build:
    name: Build Images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [odoo, langgraph]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.target }}
          file: ./src/${{ matrix.target }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.target }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. TEST (Unit & Integration)
  # =========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        test_type: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run ${{ matrix.test_type }} tests
        run: |
          docker compose -f docker-compose.test.yml run --rm test-${{ matrix.test_type }}

  # =========================================================================
  # 5. DEPLOY TO STAGING (using nettrades-setup.sh)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: [lint, security, build, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy via nettrades-setup.sh
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_PATH }}
            git pull
            ./scripts/nettrades-setup.sh all --auto
          EOF

      - name: Health check
        run: |
          curl -f http://${{ secrets.STAGING_HOST }}/odoo/health || exit 1
          curl -f http://${{ secrets.STAGING_HOST }}/langgraph/health || exit 1

  # =========================================================================
  # 6. DEPLOY TO PRODUCTION (using nettrades-setup.sh with --upgrade)
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: [deploy-staging]
    if: github.event_name == 'release'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Deploy via nettrades-setup.sh (upgrade mode)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd ${{ secrets.PRODUCTION_PATH }}
            git pull
            ./scripts/nettrades-setup.sh all --auto --upgrade
          EOF

      - name: Health check
        run: |
          curl -f https://${{ secrets.PRODUCTION_DOMAIN }}/odoo/health || exit 1
          curl -f https://${{ secrets.PRODUCTION_DOMAIN }}/langgraph/health || exit 1

  # =========================================================================
  # 7. NOTIFY (Slack)
  # =========================================================================
  notify:
    name: Notify Slack
    runs-on: ubuntu-24.04
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Deployment status: ${{ job.status }}\nRef: ${{ github.ref }}\nRepo: ${{ github.repository }}",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "title": "CI/CD Pipeline",
                  "fields": [
                    { "title": "Status", "value": "${{ job.status }}", "short": true },
                    { "title": "Branch", "value": "${{ github.ref_name }}", "short": true }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

# =============================================================================
