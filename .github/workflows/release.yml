#
# PURPOSE:
#   This workflow automatically builds and publishes Electron installers for
#   Windows, macOS, and Linux whenever a new version tag (v*) is pushed.
#
#   The workflow:
#     1. Builds the Electron installer for each platform
#     2. Uploads the installers as artifacts
#     3. Attaches them to the GitHub Release
#
# USAGE:
#   git tag -a v1.0.0 -m "Release v1.0.0"
#   git push --tags
# =============================================================================

name: Build and Release Installers

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

env:
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Build Installer
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        run: |
          cd installer
          npm ci

      - name: Build installer
        run: |
          cd installer
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: installer/dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            installer/dist/*.exe
            installer/dist/*.dmg
            installer/dist/*.AppImage
            installer/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}