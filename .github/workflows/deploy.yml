#
# PURPOSE:
#   Manual-only deployment workflow. This is triggered from the GitHub Actions
#   UI (workflow_dispatch), NOT automatically on push. Use this when you want
#   to deploy a specific ref to staging or production on demand.
#
#   Automatic deployment on push is handled by ci-cd.yml. This separation
#   prevents two workflows from racing to deploy to the same server.
#
# BRANCHING STRATEGY:
#   - main:              Stable, production-ready code. Enterprise customers clone this.
#   - dev-deployment1:   Active development branch. All PRs target this.
#   - Signatures stored in main. CLA document read from dev-deployment1.
#
# STATUS (2026-09):
#   - All deploy jobs are COMMENTED OUT because there are no servers yet.
#   - The Slack notification job is COMMENTED OUT because no webhook exists.
#   - Uncomment the relevant jobs once you have:
#       1. A staging server with SSH access
#       2. A production server with SSH access
#       3. Repository secrets: STAGING_SSH_KEY, STAGING_HOST, STAGING_USER,
#          STAGING_PATH, and the PRODUCTION_* equivalents
#       4. Optional: SLACK_WEBHOOK_URL for notifications
#
# USAGE:
#   Trigger manually from GitHub: Actions → Manual Deploy → Run workflow
# =============================================================================
name: Manual Deploy

on:
  # Manual trigger only. This workflow does NOT run on push.
  # Automatic deployment is handled by ci-cd.yml.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

