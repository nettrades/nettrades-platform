# =============================================================================
# FILE: .github/workflows/cla.yml
# =============================================================================
# PURPOSE:
#   Fully automated Contributor License Agreement (CLA) enforcement.
#   This workflow checks if PR authors have signed the CLA and prompts them
#   to sign if they haven't. Signatures are stored in the main branch.
#
# BRANCHING STRATEGY:
#   - main:              Stable, production-ready code. Enterprise customers clone this.
#   - dev-deployment1:   Active development branch. All PRs target this.
#   - Signatures are stored in main (stable storage).
#   - CLA document is read from dev-deployment1 inside the /LEGAL subfolder.
#
# NOTES:
#   - pull_request_target runs in the context of the base repo, so it is safe
#     to use here. Do NOT switch to pull_request — that would run untrusted
#     code from the fork with access to repo secrets.
#   - The allowlist uses exact string matching, not globs. A wildcard like
#     '*[bot]' has no special meaning and matches nothing.
#   - The merge_group job is a placeholder until GitHub merge queues are
#     enabled for this repository. It is harmless if unused.
