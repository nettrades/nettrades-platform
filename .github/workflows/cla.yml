name: "CLA Check"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write
  contents: read

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA Status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Check if user has signed
            const signedUsers = ['YOUR_USERNAME']; // Add users who have signed
            
            const prAuthor = context.payload.pull_request.user.login;
            
            if (signedUsers.includes(prAuthor)) {
              // User has signed - pass the check
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'CLA Check',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'CLA Signed',
                  summary: `✅ ${prAuthor} has signed the CLA.`
                }
              });
            } else {
              // User has not signed - fail the check
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'CLA Check',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'CLA Required',
                  summary: `❌ ${prAuthor} has not signed the CLA.`,
                  text: 'Please sign the CLA at: https://github.com/YOUR_REPO/blob/main/CLA.md'
                }
              });
            }