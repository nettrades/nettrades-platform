# =============================================================================
# FILE: .github/workflows/cla.yml
# =============================================================================
# Based on best practices from OpenAI, Anthropic, and Ultralytics
# =============================================================================

name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
  # CRITICAL: Merge queue support (Anthropic pattern)
  # Without this, queued PRs stay pending indefinitely[reference:50]
  merge_group:
    types: [checks_requested]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Concurrency control prevents overlapping CLA checks (Ultralytics pattern)
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    # Only run on main repository (security best practice)
    if: github.repository == 'nettrades/nettrades-platform'
    steps:
      # Step 1: Regex-based comment matching (OpenAI pattern)
      - name: "Match signing phrase"
        id: sign-or-recheck
        uses: actions-ecosystem/action-regex-match@v2
        with:
          text: ${{ github.event.comment.body }}
          regex: '\s*(I have read the CLA Document and I hereby sign the CLA)|(recheck)\s*'

      # Step 2: CLA Assistant (Anthropic/Ultralytics pattern)
      - name: "CLA Assistant"
        if: |
          steps.sign-or-recheck.outputs.match != '' ||
          github.event_name == 'pull_request_target' ||
          github.event_name == 'merge_group'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: PAT for remote signature storage (Ultralytics pattern)[reference:51]
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGN_TOKEN }}
        with:
          # Path where signatures will be stored
          path-to-signatures: 'signatures/version1/cla.json'

          # URL to the CLA document
          path-to-document: 'https://raw.githubusercontent.com/nettrades/nettrades-platform/main/Contributor-License-Agreement.md'

          # Branch for signature storage
          branch: 'main'

          # Comprehensive allowlist (Ultralytics pattern)[reference:52]
          allowlist: |
            YOUR_GITHUB_USERNAME,
            dependabot[bot],
            github-actions[bot],
            renovate[bot],
            pre-commit-ci[bot],
            claude,
            claude[bot],
            anthropic-oss-manager[bot],
            *[bot]

          # Optional: Remote signature storage (Ultralytics pattern)
          # remote-organization-name: 'nettrades'
          # remote-repository-name: 'cla-signatures'

          # Custom comments (Ultralytics pattern)[reference:53]
          custom-notsigned-prcomment: |
            👋 @$contributorName, thank you for your contribution to **NETTRADES Platform**!

            Before we can review your PR, please sign our Contributor License Agreement.

            📄 [Read the CLA](https://github.com/nettrades/nettrades-platform/blob/main/Contributor-License-Agreement.md)

            **To sign**, comment on this PR with:
            `I have read the CLA Document and I hereby sign the CLA`

            Once signed, a maintainer will confirm and proceed with the review.

          custom-allsigned-prcomment: |
            ✅ All contributors have signed the CLA. Thank you!

      # Step 3: Merge queue status report (Anthropic pattern)[reference:54]
      - name: "Report CLA status for merge queue"
        if: github.event_name == 'merge_group'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CLAAssistant',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'CLA Check Passed',
                summary: '✅ CLA check passed for merge queue.'
              }
            });