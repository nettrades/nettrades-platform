site_name: NETTRADES.AI Documentation
site_description: Documentation for the NETTRADES.AI autonomous enterprise platform
site_url: https://nettrades.github.io/nettrades-platform/
repo_url: https://github.com/nettrades/nettrades-platform
repo_name: nettrades/nettrades-platform
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy

plugins:
  - search
  - mike:
      version_selector: true
      canonical_version: null
      css_dir: css
      javascript_dir: js

nav:
  - Home: index.md
  - 🚀 Try It Now: try-it-now.md
  - 📖 Getting Started: getting-started.md

  - 👤 For Users:
      - Overview: user/index.md
      - Getting Started: user/getting-started.md
      - Job Matching: user/job-matching.md
      - Ask Someone: user/ask-someone.md
      - GPU Marketplace: user/gpu-marketplace.md
      - FAQ: user/faq.md

  - 👨‍💻 For Developers:
